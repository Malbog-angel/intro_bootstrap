<html>
	<head>
		<title> Grid System</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" 
		crossorigin="anonymous">
	</head>
	
	
	
	
	<body>
		<h1 class="text-primary">Hello World</h1>

		
		<div class="container">
			<div class="row">
			
				<div class="col-4 border border-dark bg-dark d-flex align-items-center justify-content-center"> 
				
				<img class="img-fluid" 
				src="./img/pikachu.png" style="height: 200px;"/>
				</div>
				
				<div class="col-8 border-start border-dark bg-danger"> 
				
				
				<div class="row p-5 bg-secondary">
				
					<div class="col-4 text-light"> 
						ANGEL MALBOG
					</div>																				
				 
				<div class="col-8">
						F G Y W L
					</div>
				</div>
				
				<!-- Right  ROW2 -->
				<div class="row p-2 bg-dark"> 
					<div class="col bg-dark text-align">Web Designer & Developer</div>
				</div>
				
				
				<div class="row">				
				<div class="col-3 bg-primary p-5">90% Bootstrap </div>
				<div class="col-3 bg-success p-5">75% JQuery </div>
				<div class="col-3 bg-warning p-5">80% HTML </div>
				<div class="col-3 bg-danger p-5">75% PHP </div>
				</div>
			</div>
		</div>
	</body>
	
	
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" 
	crossorigin="anonymous"></script>
	
	
	
</html>
